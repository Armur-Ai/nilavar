name: CI

# Untrusted pull requests run with read-only permissions and no secrets.
# Never switch this to `pull_request_target`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"

jobs:
  lint:
    name: fmt · clippy · hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: ./scripts/check-hygiene.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Core + CLI tests
        run: cargo test --locked -p vault-core -p vault-cli
      - name: Desktop build + unit tests
        run: cargo test --locked -p vault-desktop --lib --bins
      - name: Network sandbox test
        run: cargo test --locked -p vault-desktop --test network_sandbox
      - name: Headless UI flows (macOS Metal)
        if: runner.os == 'macOS'
        run: cargo test --locked -p vault-desktop --test ui_flows

  interop:
    name: age / rage interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install reference tools
        run: |
          sudo apt-get update && sudo apt-get install -y age
          cargo install rage --locked --version 0.12.1
      - name: Interop tests (required)
        env:
          NILAVAR_REQUIRE_INTEROP: "1"
        run: cargo test --locked -p vault-core --test interop

  secrets:
    name: secret scan (redacted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          GL=8.30.0
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz"
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml --no-banner .

  deps:
    name: dependency policy & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --locked && cargo deny check
      - run: cargo install cargo-audit --locked && cargo audit

  fuzz-smoke:
    name: fuzz smoke (bounded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: 30 s per target
        working-directory: fuzz
        run: |
          for t in payload_decode encrypted_import revision_validation markdown_parse text_ops; do
            mkdir -p corpus/$t
            cargo +nightly fuzz run $t corpus/$t seeds/$t -- -max_total_time=30 -rss_limit_mb=4096
          done
