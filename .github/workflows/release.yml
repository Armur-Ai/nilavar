name: Release

# Builds installable packages for every platform and publishes them to a
# GitHub Release when a version tag (v*) is pushed. Assets use stable names so
# https://github.com/Armur-Ai/nilavar/releases/latest/download/<asset> always
# points at the newest build. No signing keys are used; artifacts are
# ad-hoc signed (macOS) or unsigned (Windows/Linux) and labelled as such.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: cargo install cargo-cyclonedx --locked
      - run: UNIVERSAL=1 ./scripts/package-macos.sh
      - name: Stable asset names
        run: |
          mkdir -p out
          cp dist/*.dmg out/Nilavar-macOS-universal.dmg
          cp dist/nilavar-cli-*.tar.gz out/nilavar-cli-macOS-universal.tar.gz
          mkdir -p out/sbom && cp dist/sbom/*.json out/sbom/
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/ }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: cargo build --release --locked -p vault-desktop -p vault-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, pkg\Nilavar | Out-Null
          Copy-Item target\release\nilavar.exe out\Nilavar-Windows-x64.exe
          Copy-Item target\release\nilavar.exe, target\release\nilavar-cli.exe, LICENSE, README.md, docs\USER_GUIDE.md pkg\Nilavar
          Compress-Archive -Path pkg\Nilavar -DestinationPath out\Nilavar-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/ }

  linux:
    # Ubuntu 22.04 (glibc 2.35) so binaries run on current Kali, Debian 12+,
    # Ubuntu 22.04+ and Arch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked -p vault-desktop -p vault-cli
      - name: .deb (Debian / Ubuntu / Kali)
        run: ./scripts/package-deb.sh
      - name: Portable tarball
        run: |
          d=nilavar-linux-x86_64
          mkdir -p $d out
          cp target/release/nilavar target/release/nilavar-cli packaging/linux/nilavar.desktop LICENSE docs/USER_GUIDE.md $d/
          python3 tools/make_icon.py $d/nilavar.png 256
          cat > $d/install.sh <<'INSTALL'
          #!/usr/bin/env bash
          # User-local install (no root).
          set -euo pipefail
          here="$(cd "$(dirname "$0")" && pwd)"
          install -Dm755 "$here/nilavar" "$HOME/.local/bin/nilavar"
          install -Dm755 "$here/nilavar-cli" "$HOME/.local/bin/nilavar-cli"
          install -Dm644 "$here/nilavar.desktop" "$HOME/.local/share/applications/nilavar.desktop"
          install -Dm644 "$here/nilavar.png" "$HOME/.local/share/icons/hicolor/256x256/apps/nilavar.png"
          echo "Installed to ~/.local/bin (make sure it is on your PATH)."
          INSTALL
          sed -i 's/^          //' $d/install.sh && chmod +x $d/install.sh
          tar -czf out/nilavar-linux-x86_64.tar.gz $d
          cp dist/*.deb out/nilavar_amd64.deb
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/ }

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: linux, path: linux }
      - name: Build pacman package (Arch / BlackArch)
        run: |
          pacman -Syu --noconfirm --needed base-devel
          useradd -m builder
          mkdir -p /home/builder/pkg
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr - _)"
          sed "s/@PKGVER@/$ver/" packaging/arch/PKGBUILD-bin > /home/builder/pkg/PKGBUILD
          cp linux/nilavar-linux-x86_64.tar.gz /home/builder/pkg/
          chown -R builder /home/builder/pkg
          su builder -c "cd /home/builder/pkg && makepkg --nodeps --noconfirm"
          mkdir -p out
          cp /home/builder/pkg/*.pkg.tar.zst out/nilavar-x86_64.pkg.tar.zst
          pacman -Qip out/nilavar-x86_64.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: out/ }

  publish:
    needs: [macos, windows, linux, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.pkg.tar.zst' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          (cd artifacts/macos/sbom && zip -q ../../../release/sbom-cyclonedx.zip *.json)
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          pre=""
          case "$tag" in *alpha*|*beta*|*rc*) pre="--prerelease";; esac
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" $pre \
            --title "Nilavar $tag" --notes-file .github/RELEASE_NOTES.md
